<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - SmartMed AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/user.css') }}">
</head>
<body>
    <header>
        <div class="logo">
            <h1>SmartMed AI</h1>
            <p>Your Smart Medical Dispenser & Assistant</p>
        </div>
        <nav>
            <ul>
                <li><a href="{{ url_for('logout') }}">Logout</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="overlay">
            <section class="chat-interface">
                <div id="chat-box" class="chat-box">
                    <!-- Bot greeting will be loaded dynamically -->
                </div>
                <form id="chat-form" class="chat-form" autocomplete="off">
                    <input type="text" id="chat-input" placeholder=">" autocomplete="off" autofocus>
                    <span class="blinking-cursor">|</span>
                    <button type="submit" class="btn" style="display:none;">Send</button>
                </form>
            </section>
            {% if recommendation %}
            <section class="result">
                <h2>Recommended Medicine</h2>
                <p>{{ recommendation }}</p>
                <form action="{{ url_for('confirm_dispense') }}" method="POST">
                    <input type="hidden" name="medicine" value="{{ recommendation }}">
                    <button type="submit" class="btn">Confirm & Dispense</button>
                </form>
            </section>
            {% endif %}
        </div>
    </main>
    <footer>
        <p>&copy; 2025 SmartMed AI</p>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chatBox = document.getElementById('chat-box');
            const chatForm = document.getElementById('chat-form');
            const chatInput = document.getElementById('chat-input');
            
            function appendMessage(sender, text, isWarning=false) {
                const msgEl = document.createElement('div');
                msgEl.classList.add('chat-message', sender);
                if (isWarning) msgEl.classList.add('warning');
                msgEl.textContent = text;
                chatBox.appendChild(msgEl);
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            function renderOptions(options) {
                clearOptions();
                const chatForm = document.getElementById('chat-form');
                options.forEach(option => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'option-btn btn';
                    btn.textContent = option;
                    btn.onclick = async function() {
                        chatInput.value = option;
                        chatForm.dispatchEvent(new Event('submit', { cancelable: true }));
                    };
                    chatForm.appendChild(btn);
                });
            }

            function clearOptions() {
                const oldOptions = document.querySelectorAll('.option-btn');
                oldOptions.forEach(btn => btn.remove());
            }

            // On page load, fetch the greeting from the backend
            fetch("{{ url_for('chat') }}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ greeting: true })
            })
            .then(response => response.json())
            .then(data => appendMessage('bot', data.response));

            // Remove initial bot message if user starts over
            function clearChat() {
                chatBox.innerHTML = '';
                fetch("{{ url_for('chat') }}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ greeting: true })
                })
                .then(response => response.json())
                .then(data => appendMessage('bot', data.response));
            }

            chatForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                clearOptions();
                const userMsg = chatInput.value.trim();
                if (!userMsg) return;
                chatInput.disabled = true;
                chatInput.value = '';
                appendMessage('user', userMsg);
                
                try {
                    const response = await fetch("{{ url_for('chat') }}", {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: userMsg })
                    });
                    const data = await response.json();
                    
                    console.log('Server response:', data); // Debug log
                    
                    // Fixed response handling logic
                    let botMsg = null;
                    let options = null;
                    
                    if (typeof data === 'string') {
                        // Simple string response
                        botMsg = data;
                    } else if (typeof data === 'object' && data !== null) {
                        if (data.response && data.options) {
                            // Direct response with options format: {response: "...", options: [...]}
                            botMsg = data.response;
                            options = data.options;
                        } else if (data.response && typeof data.response === 'object' && data.response.response) {
                            // Nested response format: {response: {response: "...", options: [...]}}
                            botMsg = data.response.response;
                            options = data.response.options;
                        } else if (data.response && typeof data.response === 'string') {
                            // Simple response format: {response: "..."}
                            botMsg = data.response;
                        }
                    }
                    
                    // Fallback: if we still don't have botMsg, try to extract it
                    if (!botMsg) {
                        botMsg = JSON.stringify(data);
                    }
                    
                    // Display the message
                    appendMessage('bot', botMsg);
                    
                    // Render options if they exist
                    if (options && Array.isArray(options)) {
                        console.log('Rendering options:', options); // Debug log
                        renderOptions(options);
                    }
                    
                } catch (error) {
                    console.error('Error:', error);
                    appendMessage('bot', 'Oops! Something went wrong. Please try again.', true);
                } finally {
                    chatInput.disabled = false;
                    chatInput.focus();
                }
            });

            // Optional: allow Ctrl+L to clear chat (like a terminal)
            chatInput.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key.toLowerCase() === 'l') {
                    clearChat();
                    e.preventDefault();
                }
            });
        });
    </script>
</body>
</html>
